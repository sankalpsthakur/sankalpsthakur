name: Update upstream merged PRs badge

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get count
        id: count
        # GITHUB_TOKEN is repo-scoped and undercounts author-wide search
        # (wrote 81 on 2026-08-28 while GraphQL issueCount was already higher).
        # GIST_SECRET is a user PAT, so public search matches the profile query.
        env:
          GH_TOKEN: ${{ secrets.GIST_SECRET }}
        run: |
          set -euo pipefail
          COUNT=$(gh api graphql -f query='query { search(query: "author:sankalpsthakur is:pr is:merged -user:sankalpsthakur", type: ISSUE, first: 1) { issueCount } }' --jq '.data.search.issueCount')
          if ! [[ "$COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "search returned a non-count: ${COUNT}" >&2
            exit 1
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Upstream merged PRs: $COUNT"

      - name: Generate pure SVG badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 9cded476f436ff505a842e1f9293c4ae
          filename: upstream-merged-prs.svg
          label: upstream merged PRs
          message: ${{ steps.count.outputs.count }}
          color: "1f6feb"
          style: flat-square
