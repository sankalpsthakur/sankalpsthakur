name: Update accepted upstream contributions badge

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-contribution-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test counting rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Discover, verify and publish count with evidence
        # Use the user PAT for author-wide discovery and the existing gist update.
        # Private repositories are explicitly excluded by the inventory filter.
        env:
          GH_TOKEN: ${{ secrets.GIST_SECRET }}
        run: |
          set -euo pipefail
          python3 scripts/count_upstream.py --output "$RUNNER_TEMP/upstream-contributions.json" --publish
      - name: Retain scan evidence
        uses: actions/upload-artifact@v4
        with:
          name: upstream-contributions
          path: ${{ runner.temp }}/upstream-contributions.json
