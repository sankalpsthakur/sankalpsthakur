name: Update accepted upstream contributions badge

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test counting rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Get count
        id: count
        # GITHUB_TOKEN is repo-scoped and undercounts author-wide search
        # (wrote 81 on 2026-08-28 while GraphQL issueCount was already higher).
        # GIST_SECRET is a user PAT, so public search matches the profile query.
        env:
          GH_TOKEN: ${{ secrets.GIST_SECRET }}
        run: |
          set -euo pipefail
          python3 scripts/count_upstream.py

      - name: Generate pure SVG badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 9cded476f436ff505a842e1f9293c4ae
          filename: upstream-merged-prs.svg
          label: accepted upstream contributions
          message: ${{ steps.count.outputs.count }}
          color: "1f6feb"
          style: flat-square
